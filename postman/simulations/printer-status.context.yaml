purpose:
  stands_in_for: PrusaLink GET /api/v1/status responses using the existing local fixture shape.
  unblocks: Deterministic verification of video start/stop decisions without contacting a printer or camera.
assumptions:
  - id: printer-state-response-shape
    status: supported
    claim: The modeled status response exposes the state as printer.state.
    reason: The local fixture and existing caller use this path; the simulation reproduces that contract shape.
    verification: On 2026-11-08, ten HTTP lifecycle checks passed against the local simulation, including missing state and HTTP 503. This verifies the caller against the stand-in, not all physical-printer responses.
    source: api-responses/status-response when printing.json; postman/mocks/printer-status/default.cjs; tests/printer-status.integration.ts
    updated_at: "2026-11-08"
  - id: nonprinting-status-before-printing
    status: supported
    claim: The stand-in can return IDLE, BUSY, PAUSED, missing state, or an HTTP failure before reporting PRINTING.
    reason: These controlled sequences test that video does not mistake non-printing observations or elapsed time for a start signal.
    verification: On 2026-11-08, the lifecycle caller waited for PRINTING in all modeled sequences, including legacy immediate-start and timeout options. A real CLI run with a local video fixture created no capture log during IDLE, then saved a video after simulated PRINTING and FINISHED.
    source: postman/mocks/printer-status/default.cjs; tests/printer-status.integration.ts; /tmp/prusa-print-start-check/check.mjs
    updated_at: "2026-11-08"
  - id: printing-means-physical-extrusion
    status: contradicted
    claim: The physical printer reports PRINTING exactly when extrusion starts.
    reason: Captured Core One status logs report PRINTING during heating and calibration, including at Z 228.6 mm and 40 mm. Progress remains zero after Z reaches first-layer height, so waiting for positive progress would lose initial printing time.
    verification: Inspected existing recording-status.jsonl files on 2026-11-08. This contradicts the earlier unverified assumption; no new camera capture was started. The firmware status renderer exposes no extrusion position or first-layer phase.
    source: snapshots/20261108-172349/recording-status.jsonl; snapshots/20261108-163645/recording-status.jsonl; https://github.com/prusa3d/Prusa-Firmware-Buddy/blob/master/lib/WUI/nhttp/status_renderer.cpp
    updated_at: "2026-11-08"
  - id: video-overlay-status-refresh
    status: supported
    claim: Successful status polls can update telemetry in an already-running FFmpeg encoder.
    reason: Video uses an atomically replaced text file and drawtext reload=1; failed polls clear the file instead of retaining stale measurements.
    verification: Real FFmpeg frame tests verified changing text and escaping. A full CLI run against the local video-overlay simulation encoded telemetry by default and omitted it with telemetry=false. These synthetic video tests do not establish camera quality or physical first-layer timing.
    source: video-overlay.ts; tests/video-overlay.test.ts; postman/mocks/printer-status/default.cjs; /tmp/prusa-video-overlay-check/check.mjs
    updated_at: "2026-11-08"
  - id: remaining-time-means-first-layer
    status: contradicted
    claim: The presence of job.time_remaining establishes physical first-layer printing.
    reason: Both saved Core One runs include this field during preparation, including nozzle 122.4 C at Z 234.5 mm and nozzle 215.6 C at Z 40 mm.
    verification: Read existing recording-status.jsonl samples; the application now combines remaining time with positive progress or low Z and attained temperatures. No physical first-layer timing is claimed.
    source: snapshots/20261108-163645/recording-status.jsonl; snapshots/20261108-172349/recording-status.jsonl; video-printer-status.ts
    updated_at: "2026-11-08"
  - id: estimated-network-start
    status: supported
    claim: The caller waits through the modeled preparation, starts at zero progress when first-layer conditions match, and starts immediately when launched during positive-progress printing.
    reason: A network-only estimate was accepted by the user; already-running prints must not require first-layer Z. PRINTING and valid remaining time are required for both paths.
    verification: Regression tests passed for observed preparation values, missing/invalid measurements, cancellation during preparation, and positive-progress startup. Eleven HTTP lifecycle checks passed against the local simulation. Two full CLI runs with synthetic video verified no capture log during three preparation responses and immediate capture on late-print startup. Physical camera timing remains unverified.
    source: tests/video-printer-start.test.ts; tests/printer-status.integration.ts; postman/mocks/printer-status/default.cjs; /tmp/prusa-network-start-check.mjs
    updated_at: "2026-11-08"
